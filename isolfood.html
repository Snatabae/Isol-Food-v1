<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이솔 식단관리 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-neon-blue { text-shadow: 0 0 5px rgba(59, 130, 246, 0.7); }
        .bg-blue-accent { background-color: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.4); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="date"]::-webkit-calendar-picker-indicator {
            background: transparent;
            bottom: 0;
            color: transparent;
            cursor: pointer;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            width: auto;
            height: auto;
        }
    </style>
</head>
<body class="bg-black min-h-screen p-4 font-sans max-w-md mx-auto text-white/90 overflow-x-hidden flex flex-col gap-4">

    <header class="text-center my-1">
        <h1 class="text-xl font-extrabold text-white tracking-tight flex items-center justify-center gap-1.5">
            <span class="text-blue-500 text-2xl">👶</span> 이솔 식단관리 <span class="text-blue-500 font-mono text-sm">PRO</span>
        </h1>
    </header>

    <section class="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl overflow-hidden transition-all duration-300">
        <button onclick="toggleSection('register-content', 'fold-icon-register')" class="w-full px-4 py-3 flex justify-between items-center bg-gray-850 hover:bg-gray-800 transition">
            <span class="text-sm font-bold text-gray-300 flex items-center gap-1.5">
                <span class="text-blue-500">➕</span> 재료 등록하기
            </span>
            <span id="fold-icon-register" class="text-xs text-gray-500 transition-transform duration-300">▼</span>
        </button>
        
        <div id="register-content" class="p-4 border-t border-gray-800/60 space-y-3 hidden">
            <div class="flex gap-2">
                <input type="text" id="stock-name" placeholder="음식명 (예: 소고기)" class="flex-1 bg-black/40 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
                <input type="number" id="stock-count" placeholder="수량" class="w-20 bg-black/40 border border-gray-700 rounded-xl px-2 py-2.5 text-sm text-white text-center placeholder-gray-500 focus:outline-none focus:border-blue-500">
            </div>
            <button onclick="addStock()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl text-sm font-bold shadow-md active:scale-[0.98] transition">등록</button>
        </div>
    </section>

    <section class="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl overflow-hidden transition-all duration-300">
        <button onclick="toggleSection('date-content', 'fold-icon-date')" class="w-full px-4 py-3 flex justify-between items-center bg-gray-850 hover:bg-gray-800 transition">
            <span class="text-sm font-bold text-gray-300 flex items-center gap-1.5">
                <span>📅</span> 식단 계획 날짜 선택 <span id="date-day-display" class="text-blue-400 text-xs font-semibold ml-1"></span>
            </span>
            <span id="fold-icon-date" class="text-xs text-gray-500 transition-transform duration-300">▲</span>
        </button>

        <div id="date-content" class="p-4 border-t border-gray-800/60 flex flex-col gap-2">
            <div class="flex items-center gap-2">
                <button onclick="moveDate(-1)" class="bg-gray-800 hover:bg-gray-700 text-white px-3 py-2.5 rounded-xl text-sm font-bold transition active:scale-95">&lt;</button>
                <div class="relative flex-1">
                    <input type="date" id="diet-date" onchange="loadDietData()" class="w-full bg-black/40 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white font-semibold text-center focus:outline-none focus:border-blue-500 cursor-pointer">
                </div>
                <button onclick="moveDate(1)" class="bg-gray-800 hover:bg-gray-700 text-white px-3 py-2.5 rounded-xl text-sm font-bold transition active:scale-95">&gt;</button>
            </div>
        </div>
    </section>

    <section class="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl overflow-hidden transition-all duration-300">
        <button onclick="toggleSection('meal-content', 'fold-icon-meal')" class="w-full px-4 py-3 flex justify-between items-center bg-gray-850 hover:bg-gray-800 transition">
            <span class="text-sm font-bold text-gray-300 flex items-center gap-1.5">
                <span>🍽️</span> 오늘의 메뉴
            </span>
            <span id="fold-icon-meal" class="text-xs text-gray-500 transition-transform duration-300">▲</span>
        </button>

        <div id="meal-content" class="p-4 border-t border-gray-800/60 flex flex-col gap-3">
            <div id="meal-morning" onclick="selectMeal('morning')" class="p-3.5 rounded-xl border border-gray-800 bg-black/20 cursor-pointer transition flex flex-col gap-1">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-extrabold px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">🌅 아침</span>
                    <div class="flex gap-3">
                        <button id="copy-morning" onclick="copyMealText('morning', event)" class="text-[11px] text-blue-400 hover:text-blue-300 font-medium hidden">📋 복사</button>
                        <button onclick="clearMeal('morning', event)" class="text-[11px] text-gray-500 hover:text-gray-400">비우기</button>
                    </div>
                </div>
                <div id="text-morning" class="text-sm font-semibold text-gray-400 min-h-[24px] pt-1">음식을 선택 후 아래 재고 박스를 누르세요</div>
            </div>

            <div id="meal-lunch" onclick="selectMeal('lunch')" class="p-3.5 rounded-xl border border-gray-800 bg-black/20 cursor-pointer transition flex flex-col gap-1">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-extrabold px-2 py-0.5 rounded bg-sky-500/10 text-sky-400 border border-sky-500/20">☀️ 점심</span>
                    <div class="flex gap-3">
                        <button id="copy-lunch" onclick="copyMealText('lunch', event)" class="text-[11px] text-blue-400 hover:text-blue-300 font-medium hidden">📋 복사</button>
                        <button onclick="clearMeal('lunch', event)" class="text-[11px] text-gray-500 hover:text-gray-400">비우기</button>
                    </div>
                </div>
                <div id="text-lunch" class="text-sm font-semibold text-gray-400 min-h-[24px] pt-1">음식을 선택 후 아래 재고 박스를 누르세요</div>
            </div>

            <div id="meal-dinner" onclick="selectMeal('dinner')" class="p-3.5 rounded-xl border border-gray-800 bg-black/20 cursor-pointer transition flex flex-col gap-1">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-extrabold px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">🌙 저녁</span>
                    <div class="flex gap-3">
                        <button id="copy-dinner" onclick="copyMealText('dinner', event)" class="text-[11px] text-blue-400 hover:text-blue-300 font-medium hidden">📋 복사</button>
                        <button onclick="clearMeal('dinner', event)" class="text-[11px] text-gray-500 hover:text-gray-400">비우기</button>
                    </div>
                </div>
                <div id="text-dinner" class="text-sm font-semibold text-gray-400 min-h-[24px] pt-1">음식을 선택 후 아래 재고 박스를 누르세요</div>
            </div>
        </div>
    </section>

    <section class="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl overflow-hidden transition-all duration-300">
        <button onclick="toggleSection('stock-content', 'fold-icon-stock')" class="w-full px-4 py-3 flex justify-between items-center bg-gray-850 hover:bg-gray-800 transition">
            <span class="text-sm font-bold text-gray-300 flex items-center gap-1.5">
                <span>📦</span> 잔여량
            </span>
            <span id="fold-icon-stock" class="text-xs text-gray-500 transition-transform duration-300">▲</span>
        </button>

        <div id="stock-content" class="p-4 border-t border-gray-800/60">
            <div id="stock-list" class="grid grid-cols-2 gap-2.5 max-h-[280px] overflow-y-auto no-scrollbar pr-0.5">
                </div>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAO_hFm_GHk4arOS1KRIxl4jFWc90oGda0",
            authDomain: "isol-food-v1.firebaseapp.com",
            databaseURL: "https://isol-food-v1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "isol-food-v1",
            storageBucket: "isol-food-v1.firebasestorage.app",
            messagingSenderId: "745053225932",
            appId: "1:745053225932:web:80348e44836703fa03d369"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentSelectedMeal = 'morning'; 
        let currentDietData = { morning: {}, lunch: {}, dinner: {} };

        // 화살표 로직을 명확하게 수정한 토글 제어 메커니즘
        window.toggleSection = function(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            if(content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.innerText = '▲'; // 펼쳐짐: 위쪽 삼각형
            } else {
                content.classList.add('hidden');
                icon.innerText = '▼'; // 최소화됨: 아래쪽 삼각형
            }
        }

        window.addStock = function() {
            const name = document.getElementById('stock-name').value.trim();
            const count = parseInt(document.getElementById('stock-count').value) || 0;
            if(!name) return alert('음식 이름을 입력하세요.');

            set(ref(db, 'stocks/' + name), { name, count });
            document.getElementById('stock-name').value = '';
            document.getElementById('stock-count').value = '';
            window.toggleSection('register-content', 'fold-icon-register'); 
        }

        window.deleteStockElement = function(name, event) {
            event.stopPropagation(); 
            if(confirm(`[${name}] 재고 박스를 삭제하시겠습니까?`)) {
                remove(ref(db, 'stocks/' + name));
            }
        }

        window.moveDate = function(days) {
            const dateInput = document.getElementById('diet-date');
            if (!dateInput.value) return;
            
            const currentDate = new Date(dateInput.value);
            currentDate.setDate(currentDate.getDate() + days);
            
            dateInput.value = currentDate.toISOString().substring(0, 10);
            window.loadDietData();
        }

        window.updateDayDisplay = function(dateStr) {
            const week = ['일', '월', '화', '수', '목', '금', '토'];
            const dayOfWeek = week[new Date(dateStr).getDay()];
            document.getElementById('date-day-display').innerText = `(${dayOfWeek})`;
        }

        window.selectMeal = function(mealType) {
            currentSelectedMeal = mealType;
            ['morning', 'lunch', 'dinner'].forEach(type => {
                const el = document.getElementById('meal-' + type);
                if(type === mealType) {
                    el.classList.add('bg-blue-accent', 'border-blue-500/60');
                } else {
                    el.classList.remove('bg-blue-accent', 'border-blue-500/60');
                }
            });
        }

        window.clickStockCard = function(stockName) {
            const date = document.getElementById('diet-date').value;
            if(!date) return alert('날짜를 먼저 선택해 주세요.');

            const stockRef = ref(db, 'stocks/' + stockName);
            get(stockRef).then((snapshot) => {
                const stockData = snapshot.val();
                if(!stockData || stockData.count <= 0) {
                    alert('잔여 재고가 부족합니다!');
                    return;
                }

                set(stockRef, { name: stockName, count: stockData.count - 1 });

                if(!currentDietData[currentSelectedMeal]) {
                    currentDietData[currentSelectedMeal] = {};
                }
                
                const currentCountInMeal = currentDietData[currentSelectedMeal][stockName] || 0;
                currentDietData[currentSelectedMeal][stockName] = currentCountInMeal + 1;

                set(ref(db, `diets_v2/${date}`), currentDietData);
            });
        }

        window.adjustStockCount = function(stockName, change, event) {
            event.stopPropagation(); 
            const stockRef = ref(db, 'stocks/' + stockName);
            get(stockRef).then((snapshot) => {
                const stockData = snapshot.val();
                if(stockData) {
                    const newCount = Math.max(0, stockData.count + change);
                    set(stockRef, { name: stockName, count: newCount });
                }
            });
        }

        window.clearMeal = function(mealType, event) {
            event.stopPropagation();
            const date = document.getElementById('diet-date').value;
            if(!date) return;

            const mealFoods = currentDietData[mealType] || {};
            if(Object.keys(mealFoods).length === 0) return;

            if(confirm('해당 끼니의 식단을 비우고 차감된 재고를 복구하시겠습니까?')) {
                for(let foodName in mealFoods) {
                    const returnCount = mealFoods[foodName];
                    const stockRef = ref(db, 'stocks/' + foodName);
                    
                    get(stockRef).then((snapshot) => {
                        const sData = snapshot.val();
                        if(sData) {
                            set(stockRef, { name: foodName, count: sData.count + returnCount });
                        } else {
                            set(stockRef, { name: foodName, count: returnCount });
                        }
                    });
                }

                currentDietData[mealType] = {};
                set(ref(db, `diets_v2/${date}`), currentDietData);
            }
        }

        window.copyMealText = function(mealType, event) {
            event.stopPropagation();
            const foods = currentDietData[mealType];
            if(!foods || Object.keys(foods).length === 0) return;

            const textArray = [];
            for(let name in foods) {
                textArray.push(`${name}${foods[name]}`);
            }
            const resultText = textArray.join(', ');

            navigator.clipboard.writeText(resultText).then(() => {
                alert(`복사 완료: ${resultText}`);
            }).catch(err => {
                const textArea = document.createElement("textarea");
                textArea.value = resultText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert(`복사 완료: ${resultText}`);
            });
        }

        window.loadDietData = function() {
            const date = document.getElementById('diet-date').value;
            if(!date) return;

            window.updateDayDisplay(date);

            onValue(ref(db, `diets_v2/${date}`), (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    currentDietData = {
                        morning: data.morning || {},
                        lunch: data.lunch || {},
                        dinner: data.dinner || {}
                    };
                } else {
                    currentDietData = { morning: {}, lunch: {}, dinner: {} };
                }

                ['morning', 'lunch', 'dinner'].forEach(type => {
                    const textEl = document.getElementById('text-' + type);
                    const copyBtn = document.getElementById('copy-' + type);
                    const foods = currentDietData[type];
                    
                    if(!foods || Object.keys(foods).length === 0) {
                        textEl.innerHTML = `<span class="text-gray-500 text-xs font-normal">지정된 메뉴가 없습니다. 아래 박스를 눌러 추가하세요.</span>`;
                        copyBtn.classList.add('hidden');
                    } else {
                        const foodStringArray = [];
                        for(let name in foods) {
                            foodStringArray.push(`<span class="text-white font-bold">${name}</span> <span class="text-blue-400 font-mono text-xs">${foods[name]}</span>`);
                        }
                        textEl.innerHTML = foodStringArray.join(', ');
                        copyBtn.classList.remove('hidden'); 
                    }
                });
            });
        }

        onValue(ref(db, 'stocks'), (snapshot) => {
            const stockListEl = document.getElementById('stock-list');
            stockListEl.innerHTML = '';
            const data = snapshot.val();
            
            if(!data || Object.keys(data).length === 0) {
                stockListEl.innerHTML = `<div class="col-span-2 text-center py-6 text-xs text-gray-500">등록된 음식 박스가 없습니다.</div>`;
                return;
            }

            for (let key in data) {
                const item = data[key];
                stockListEl.innerHTML += `
                    <div onclick="window.clickStockCard('${item.name}')" class="relative flex flex-col justify-between p-3.5 bg-gray-900/80 rounded-xl border border-gray-800 hover:border-gray-700 shadow-md active:scale-[0.97] transition cursor-pointer select-none h-24">
                        <button onclick="window.deleteStockElement('${item.name}', event)" class="absolute top-1 right-2 text-gray-600 hover:text-red-400 font-sans text-xs p-1 transition">×</button>
                        
                        <div class="text-sm font-bold text-white/90 truncate pr-4">${item.name}</div>
                        
                        <div class="flex justify-between items-center mt-2">
                            <div class="flex gap-1">
                                <button onclick="window.adjustStockCount('${item.name}', -1, event)" class="w-6 h-6 flex items-center justify-center bg-gray-800 hover:bg-gray-700 rounded text-gray-400 text-xs font-bold active:scale-90 transition">-</button>
                                <button onclick="window.adjustStockCount('${item.name}', 1, event)" class="w-6 h-6 flex items-center justify-center bg-gray-800 hover:bg-gray-700 rounded text-gray-400 text-xs font-bold active:scale-90 transition">+</button>
                            </div>
                            <div class="text-right">
                                <span class="text-[10px] text-gray-500">잔여</span>
                                <span class="text-base font-black text-blue-400 text-neon-blue">${item.count}</span>
                            </div>
                        </div>
                    </div>`;
            }
        });

        const todayStr = new Date().toISOString().substring(0, 10);
        document.getElementById('diet-date').value = todayStr;
        window.selectMeal('morning'); 
        window.loadDietData();       
    </script>
</body>
</html>
