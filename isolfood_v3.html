<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이솔 식단관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-neon-blue { text-shadow: 0 0 5px rgba(59, 130, 246, 0.4); }
        .bg-blue-accent { background-color: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.5) !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 캘린더 위치 고정 오류 수정 */
        input[type="date"] {
            position: relative;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            background: transparent;
            bottom: 0;
            color: transparent;
            cursor: pointer;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
        .stocks-locked .quantity-btn {
            opacity: 0.25;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen p-4 font-sans max-w-md mx-auto text-slate-100/90 overflow-x-hidden flex flex-col gap-4">

    <header class="text-center my-1">
        <h1 class="text-lg font-bold tracking-tight text-slate-200">
            이솔 식단관리
        </h1>
    </header>

    <section class="bg-slate-900 rounded-2xl border border-slate-800 shadow-2xl overflow-hidden transition-all duration-300">
        <button onclick="toggleSection('register-content', 'fold-icon-register')" class="w-full px-4 py-3.5 flex justify-between items-center bg-slate-900/50 hover:bg-slate-850 transition">
            <span class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-blue-400"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                재료 등록하기
            </span>
            <span id="fold-icon-register" class="text-xs text-slate-500 transition-transform duration-300">▼</span>
        </button>
        
        <div id="register-content" class="p-4 border-t border-slate-800/60 space-y-3 hidden">
            <div class="flex gap-2">
                <input type="text" id="stock-name" placeholder="음식명 (예: 소)" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500/50">
                <input type="number" id="stock-count" placeholder="수량" class="w-14 bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-sm text-slate-200 text-center placeholder-slate-600 focus:outline-none focus:border-blue-500/50">
                <input type="date" id="stock-date" class="w-28 bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs text-slate-200 text-center focus:outline-none focus:border-blue-500/50 cursor-pointer">
            </div>
            <button onclick="addStock()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-xl text-sm font-bold shadow-md active:scale-[0.98] transition">등록</button>
        </div>
    </section>

    <section class="bg-slate-900 rounded-2xl border border-slate-800 shadow-2xl overflow-hidden transition-all duration-300">
        <button onclick="toggleSection('date-content', 'fold-icon-date')" class="w-full px-4 py-3.5 flex justify-between items-center bg-slate-900/50 hover:bg-slate-850 transition">

                식단 계획 날짜 선택 <span id="date-day-display" class="text-blue-400 text-xs font-medium ml-1"></span>
            </span>
            <span id="fold-icon-date" class="text-xs text-slate-500 transition-transform duration-300">▲</span>
        </button>

        <div id="date-content" class="p-4 border-t border-slate-800/60 flex flex-col gap-2">
            <div class="flex items-center gap-2">
                <button onclick="moveDate(-1)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl text-sm font-bold transition active:scale-95">&lt;</button>

            </div>
        </div>
    </section>

            <span id="fold-icon-meal" class="text-xs text-slate-500 transition-transform duration-300">▲</span>
        </button>

            <div id="meal-morning" onclick="selectMeal('morning')" class="p-3 rounded-xl border border-slate-800 bg-slate-950/40 cursor-pointer transition flex flex-col gap-1">

                        <button onclick="clearMeal('morning', event)" class="text-[11px] text-slate-500 hover:text-slate-400">비우기</button>
                    </div>
                </div>
                <div id="text-morning" class="text-sm font-medium text-slate-400 min-h-[24px] pt-1">음식을 선택 후 아래 재고 박스를 누르세요</div>
            </div>

            <div id="meal-lunch" onclick="selectMeal('lunch')" class="p-3 rounded-xl border border-slate-800 bg-slate-950/40 cursor-pointer transition flex flex-col gap-1">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">점심</span>
                    <div class="flex gap-3">
                        <button id="copy-lunch" onclick="copyMealText('lunch', event)" class="text-[11px] text-blue-400 hover:text-blue-300 font-medium hidden">📋 복사</button>

                </div>

            </div>

            <div id="meal-dinner" onclick="selectMeal('dinner')" class="p-3 rounded-xl border border-slate-800 bg-slate-950/40 cursor-pointer transition flex flex-col gap-1">

                    <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">저녁</span>

            '매생이': '버섯/해조류', '우뭇가사리': '버섯/해조류', '해송이버섯': '버섯/해조류',
            '사과': '과일', '바나나': '과일', '배': '과일', '참외': '과일', '수박': '과일', '멜론': '과일', 
            '딸기': '과일', '블루베리': '과일', '아보카도': '과일', '귤': '과일', '오렌지': '과일', '자두': '과일', 
            '포도': '과일', '복숭아': '과일', '자몽': '과일', '레몬': '과일', '라임': '과일', '망고': '과일', 
            '키위': '과일', '무화과': '과일', '석류': '과일', '체리': '과일', '대추': '과일', '곶감': '과일', 
            '한라봉': '과일', '레드향': '과일', '샤인머스캣': '과일', '라즈베리': '과일'
        };

        const CATEGORY_ICONS = {
            '곡류': '•', '육류/알류': '•', '어패류': '•', '두류/유제품': '•', 
            '잎채소': '•', '뿌리/열매채소': '•', '버섯/해조류': '•', '과일': '•', '미분류': '•'
        };

        function getCategoryOfIngredient(foodName) {
            if (!foodName || typeof foodName !== 'string') return '미분류';
            const targetName = foodName.trim();
            if (FOOD_DICTIONARY[targetName]) return FOOD_DICTIONARY[targetName];
            for (const key in FOOD_DICTIONARY) {
                if (targetName.includes(key)) return FOOD_DICTIONARY[key];
            }
            return '미분류';
        }

        window.toggleSection = function(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            if(content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.innerText = '▲';
            } else {
                content.classList.add('hidden');
                icon.innerText = '▼';
            }
        }

        window.toggleStockLock = function(event) {
            event.stopPropagation(); 
            isStockLocked = !isStockLocked;
            
            const lockBtn = document.getElementById('lock-btn');
            const stockList = document.getElementById('stock-list');
            
            if (isStockLocked) {
                lockBtn.innerHTML = lockIconClosed;
                lockBtn.className = "w-7 h-7 flex items-center justify-center bg-slate-800 border border-slate-700 rounded-lg active:scale-95 transition";
                if (stockList) stockList.classList.add('stocks-locked');
            } else {
                lockBtn.innerHTML = lockIconOpen;
                lockBtn.className = "w-7 h-7 flex items-center justify-center bg-blue-600 border border-blue-500 rounded-lg active:scale-95 transition";
                if (stockList) stockList.classList.remove('stocks-locked');
            }
        }

        window.addStock = function() {
            const name = document.getElementById('stock-name').value.trim();
            const count = parseInt(document.getElementById('stock-count').value) || 0;
            const madeDate = document.getElementById('stock-date').value; 
            if(!name) return alert('음식 이름을 입력하세요.');
            if(!madeDate) return alert('만든 날짜를 선택해 주세요.');

            set(ref(db, 'stocks/' + name), { name, count, madeDate });
            document.getElementById('stock-name').value = '';
            document.getElementById('stock-count').value = '';
            document.getElementById('stock-date').value = new Date().toISOString().substring(0, 10);
            window.toggleSection('register-content', 'fold-icon-register'); 
        }

        window.deleteStockElement = function(name, event) {
            event.stopPropagation(); 
            if(confirm(`[${name}] 재고 박스를 삭제하시겠습니까?`)) {
                remove(ref(db, 'stocks/' + name));
            }
        }

        window.moveDate = function(days) {
            const dateInput = document.getElementById('diet-date');
            if (!dateInput.value) return;
            const currentDate = new Date(dateInput.value);
            currentDate.setDate(currentDate.getDate() + days);
            dateInput.value = currentDate.toISOString().substring(0, 10);
            window.loadDietData();
        }

        window.updateDayDisplay = function(dateStr) {
            const week = ['일', '월', '화', '수', '목', '금', '토'];
            const dayOfWeek = week[new Date(dateStr).getDay()];
            document.getElementById('date-day-display').innerText = `(${dayOfWeek})`;
        }

        window.selectMeal = function(mealType) {
            currentSelectedMeal = mealType;
            ['morning', 'lunch', 'dinner'].forEach(type => {
                const el = document.getElementById('meal-' + type);
                if(type === mealType) {
                    el.classList.add('bg-blue-accent', 'border-blue-500/50');
                } else {
                    el.classList.remove('bg-blue-accent', 'border-blue-500/50');
                }
            });
        }

        window.clickStockCard = function(stockName, event) {
            const date = document.getElementById('diet-date').value;
            if(!date) return alert('날짜를 먼저 선택해 주세요.');

            const card = event.currentTarget;
            
            card.classList.remove('border-slate-800', 'bg-slate-900/85', 'border-red-900/60', 'bg-red-950/10');
            card.classList.add('border-blue-500/70', 'bg-slate-800', 'scale-95');

            const stockRef = ref(db, 'stocks/' + stockName);
            get(stockRef).then((snapshot) => {
                const stockData = snapshot.val();
                if(!stockData || stockData.count <= 0) {
                    alert('잔여 재고가 부족합니다!');
                    window.loadDietData(); 
                    return;
                }

                setTimeout(() => {
                    set(stockRef, { 
                        name: stockName, 
                        count: stockData.count - 1,
                        madeDate: stockData.madeDate || new Date().toISOString().substring(0, 10) 
                    });

                    if(!currentDietData[currentSelectedMeal]) {
                        currentDietData[currentSelectedMeal] = {};
                    }
                    const currentCountInMeal = currentDietData[currentSelectedMeal][stockName] || 0;
                    currentDietData[currentSelectedMeal][stockName] = currentCountInMeal + 1;

                    set(ref(db, `diets_v2/${date}`), currentDietData);
                }, 100);
            });
        }

        window.removeFoodFromMeal = function(mealType, foodName, event) {
            event.stopPropagation(); 
            const date = document.getElementById('diet-date').value;
            if(!date) return;

            const stockRef = ref(db, 'stocks/' + foodName);
            get(stockRef).then((snapshot) => {
                const stockData = snapshot.val();
                const currentStockCount = stockData ? stockData.count : 0;
                const existingDate = stockData ? (stockData.madeDate || new Date().toISOString().substring(0, 10)) : new Date().toISOString().substring(0, 10);
                
                set(stockRef, { name: foodName, count: currentStockCount + 1, madeDate: existingDate });

                if(currentDietData[mealType] && currentDietData[mealType][foodName]) {
                    currentDietData[mealType][foodName] -= 1;
                    if(currentDietData[mealType][foodName] <= 0) {
                        delete currentDietData[mealType][foodName];
                    }
                    set(ref(db, `diets_v2/${date}`), currentDietData);
                }
            });
        }

        window.adjustStockCount = function(stockName, change, event) {
            event.stopPropagation(); 
            if (isStockLocked) return; 

            const stockRef = ref(db, 'stocks/' + stockName);
            get(stockRef).then((snapshot) => {
                const stockData = snapshot.val();
                if(stockData) {
                    const newCount = Math.max(0, stockData.count + change);
                    set(stockRef, { 
                        name: stockName, 
                        count: newCount, 
                        madeDate: stockData.madeDate || new Date().toISOString().substring(0, 10) 
                    });
                }
            });
        }

        window.clearMeal = function(mealType, event) {
            event.stopPropagation();
            const date = document.getElementById('diet-date').value;
            if(!date) return;

            const mealFoods = currentDietData[mealType] || {};
            if(Object.keys(mealFoods).length === 0) return;

            if(confirm('해당 끼니의 식단을 비우고 차감된 재고를 복구하시겠습니까?')) {
                for(let foodName in mealFoods) {
                    const returnCount = mealFoods[foodName];
                    const stockRef = ref(db, 'stocks/' + foodName);
                    
                    get(stockRef).then((snapshot) => {
                        const sData = snapshot.val();
                        if(sData) {
                            set(stockRef, { name: foodName, count: sData.count + returnCount, madeDate: sData.madeDate || new Date().toISOString().substring(0, 10) });
                        } else {
                            set(stockRef, { name: foodName, count: returnCount, madeDate: new Date().toISOString().substring(0, 10) });
                        }
                    });
                }

                currentDietData[mealType] = {};
                set(ref(db, `diets_v2/${date}`), currentDietData);
            }
        }

        window.copyMealText = function(mealType, event) {
            event.stopPropagation();
            const foods = currentDietData[mealType];
            if(!foods || Object.keys(foods).length === 0) return;

            const textArray = [];
            for(let name in foods) {
                textArray.push(`${name}`);
            }
            const resultText = textArray.join(', ');

            navigator.clipboard.writeText(resultText).catch(err => {
                const textArea = document.createElement("textarea");
                textArea.value = resultText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            });
        }

        window.loadDietData = function() {
            const date = document.getElementById('diet-date').value;
            if(!date) return;

            window.updateDayDisplay(date);

            onValue(ref(db, `diets_v2/${date}`), (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    currentDietData = {
                        morning: data.morning || {},
                        lunch: data.lunch || {},
                        dinner: data.dinner || {}
                    };
                } else {
                    currentDietData = { morning: {}, lunch: {}, dinner: {} };
                }

                ['morning', 'lunch', 'dinner'].forEach(type => {
                    const textEl = document.getElementById('text-' + type);
                    const copyBtn = document.getElementById('copy-' + type);
                    const foods = currentDietData[type];
                    
                    if(!foods || Object.keys(foods).length === 0) {
                        textEl.innerHTML = `<span class="text-slate-600 text-xs font-normal">지정된 메뉴가 없습니다. 아래 박스를 눌러 추가하세요.</span>`;
                        copyBtn.classList.add('hidden');
                    } else {
                        const foodStringArray = [];
                        for(let name in foods) {
                            foodStringArray.push(`
                                <span onclick="window.removeFoodFromMeal('${type}', '${name}', event)" class="cursor-pointer hover:text-red-400 transition-colors duration-150 select-none">
                                    <span class="text-slate-100 font-medium text-sm">${name}</span> 
                                    <span class="text-slate-500 font-mono text-xs ml-0.5">${foods[name]}</span>
                                </span>
                            `);
                        }
                        textEl.innerHTML = foodStringArray.join(', ');
                        copyBtn.classList.remove('hidden'); 
                    }
                });
            });
        }

        onValue(ref(db, 'stocks'), (snapshot) => {
            const stockListEl = document.getElementById('stock-list');
            if (!stockListEl) return;
            stockListEl.innerHTML = '';
            
            const data = snapshot.val();
            if(!data || typeof data !== 'object') {
                stockListEl.innerHTML = `<div class="text-center py-6 text-xs text-slate-600">등록된 음식 박스가 없습니다.</div>`;
                return;
            }

            const groupedStocks = {};
            Object.keys(data).forEach(key => {
                const item = data[key];
                if (!item || !item.name) return; 
                const category = getCategoryOfIngredient(item.name);
                if (!groupedStocks[category]) {
                    groupedStocks[category] = [];
                }
                groupedStocks[category].push(item);
            });

            const categoryOrder = ['곡류', '육류/알류', '어패류', '두류/유제품', '잎채소', '뿌리/열매채소', '버섯/해조류', '과일', '미분류'];
            let visibleSections = 0;

            const todayObj = new Date();
            todayObj.setHours(0,0,0,0);

            categoryOrder.forEach(category => {
                const items = groupedStocks[category];
                if (!items || items.length === 0) return;

                visibleSections++;
                const categoryIcon = CATEGORY_ICONS[category] || '•';
                let categorySectionHtml = `
                    <div class="space-y-1.5 mt-1">
                        <div class="text-xs font-semibold text-slate-400 bg-slate-950/60 px-2.5 py-1 rounded-lg border border-slate-800 flex items-center justify-between select-none">
                            <div class="flex items-center gap-1.5">
                                <span class="text-blue-500 font-bold">${categoryIcon}</span>
                                <span>${category}</span>
                            </div>
                            <span class="text-[10px] text-slate-600 font-mono font-normal">종류: ${items.length}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                `;

                items.forEach(item => {
                    let dateDisplay = '-';
                    let isExpired = false;

                    if (item.madeDate) {
                        const itemDateObj = new Date(item.madeDate);
                        itemDateObj.setHours(0,0,0,0);
                        const diffTime = todayObj - itemDateObj;
                        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                        
                        const dateParts = item.madeDate.split('-');
                        if (dateParts.length === 3) {
                            dateDisplay = `${dateParts[1]}.${dateParts[2]}`; 
                        } else {
                            dateDisplay = item.madeDate;
                        }

                        if (diffDays >= 14) {
                            isExpired = true; 
                        }
                    }

                    categorySectionHtml += `
                        <div onclick="window.clickStockCard('${item.name}', event)" class="relative flex flex-col justify-between p-2 rounded-xl border shadow-md transition-all duration-75 cursor-pointer select-none h-[68px] ${isExpired ? 'border-red-900/60 bg-red-950/10' : 'border-slate-800 hover:border-slate-700 bg-slate-900/85'}">
                            <button onclick="window.deleteStockElement('${item.name}', event)" class="absolute top-0.5 right-1.5 text-slate-600 hover:text-red-400 font-sans text-xs p-0.5 transition">×</button>
                            
                            <div>
                                <div class="text-xs font-semibold text-slate-200 truncate pr-4">${item.name}</div>
                                <div class="text-[9px] font-mono mt-0.5 ${isExpired ? 'text-red-400 font-medium' : 'text-slate-500'}">
                                    ${item.madeDate ? '제조: ' + dateDisplay : ''} ${isExpired ? '(2주경과)' : ''}
                                </div>
                            </div>
                            
                            <div class="flex justify-between items-center mt-0.5">
                                <div class="flex gap-1">
                                    <button onclick="window.adjustStockCount('${item.name}', -1, event)" class="quantity-btn w-5 h-5 flex items-center justify-center bg-slate-800 hover:bg-slate-700 rounded text-slate-400 text-[10px] font-bold active:scale-90 transition">-</button>
                                    <button onclick="window.adjustStockCount('${item.name}', 1, event)" class="quantity-btn w-5 h-5 flex items-center justify-center bg-slate-800 hover:bg-slate-700 rounded text-slate-400 text-[10px] font-bold active:scale-90 transition">+</button>
                                </div>
                                <div class="text-right flex items-baseline gap-0.5">
                                    <span class="text-[9px] text-slate-600">잔여</span>
                                    <span class="text-sm font-bold text-blue-400 text-neon-blue">${item.count}</span>
                                </div>
                            </div>
                        </div>`;
                });

                categorySectionHtml += `</div></div>`;
                stockListEl.innerHTML += categorySectionHtml;
            });

            if (visibleSections === 0) {
                stockListEl.innerHTML = `<div class="text-center py-6 text-xs text-slate-600">등록된 음식 박스가 없습니다.</div>`;
            }
        });

        const todayStr = new Date().toISOString().substring(0, 10);
        document.getElementById('diet-date').value = todayStr;
        document.getElementById('stock-date').value = todayStr; 
        window.selectMeal('morning'); 
        window.loadDietData();       
        
        document.getElementById('lock-btn').innerHTML = lockIconClosed;
    </script>
</body>
</html>
